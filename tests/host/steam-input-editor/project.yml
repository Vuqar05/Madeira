name: EditorProbe
options:
  bundleIdPrefix: com.madeira.tests
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
    SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
    HEADER_SEARCH_PATHS: ['$(SRCROOT)/dock']
targets:
  EditorProbe:
    type: application
    platform: iOS
    sources: [Sources]
  EditorTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EditorTests.swift]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ''
    dependencies:
      - target: EditorProbe
schemes:
  EditorProbe:
    build:
      targets:
        EditorProbe: all
        EditorTests: [test]
    test:
      targets: [EditorTests]
