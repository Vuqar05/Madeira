name: NavigationProbe
options:
  bundleIdPrefix: com.madeira.tests
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NavigationProbe:
    type: application
    platform: iOS
    sources: [App.swift]
  NavigationTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NavigationTests.swift]
    dependencies:
      - target: NavigationProbe
schemes:
  NavigationProbe:
    build:
      targets:
        NavigationProbe: all
        NavigationTests: [test]
    test:
      targets: [NavigationTests]
